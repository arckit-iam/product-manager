services:
  api:
    build: .
    container_name: product-manager-api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB requis}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER requis}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_FLYWAY_USER: ${POSTGRES_USER}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      ARC_SECURITY_ISSUER_URI: ${ARC_SECURITY_ISSUER_URI:?ARC_SECURITY_ISSUER_URI requis}
      ARC_SECURITY_JWK_SET_URI: ${ARC_SECURITY_JWK_SET_URI:-http://arc-auth:8082/.well-known/jwks.json}
      ARC_AUTH_URL: ${ARC_AUTH_URL:-http://arc-auth:8082}
      ARC_AUTH_USERNAME: ${ARC_AUTH_USERNAME:?ARC_AUTH_USERNAME requis}
      ARC_AUTH_PASSWORD: ${ARC_AUTH_PASSWORD:?ARC_AUTH_PASSWORD requis}
      ARC_PUBLISHER_URL: ${ARC_PUBLISHER_URL:-http://arc-publisher:8081}
    restart: unless-stopped
    networks:
      - product-manager-net

  db:
    image: postgres:16-alpine
    container_name: product-manager-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - product-manager-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - product-manager-net

volumes:
  product-manager-data:

networks:
  product-manager-net:
    driver: bridge
