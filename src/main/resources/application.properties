spring.application.name=product-manager
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
arc.publisher.url=${ARC_PUBLISHER_URL:http://arc-publisher:8081}
arc.publisher.target-system=${ARC_PUBLISHER_TARGET_SYSTEM:ad://DC01}
arc.publisher.source=${ARC_PUBLISHER_SOURCE:product-manager}

# Validation des jetons JWT emis par arc-auth (cles publiques recuperees a la demande).
# issuer-uri : valeur attendue de iss, obligatoire (aucune decouverte OIDC avec jwk-set-uri).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${ARC_SECURITY_JWK_SET_URI:http://arc-auth:8082/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ARC_SECURITY_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ARC_SECURITY_AUDIENCE:arc}

# Compte de service utilise pour appeler arc-publisher (role ARC_PUBLISHER).
arc.auth.url=${ARC_AUTH_URL:http://arc-auth:8082}
arc.auth.username=${ARC_AUTH_USERNAME}
arc.auth.password=${ARC_AUTH_PASSWORD}


