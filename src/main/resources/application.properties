spring.application.name=product-manager
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
arc.publisher.url=${ARC_PUBLISHER_URL:http://arc-publisher:8081}
arc.publisher.target-system=${ARC_PUBLISHER_TARGET_SYSTEM:ad://DC01}
arc.publisher.source=${ARC_PUBLISHER_SOURCE:product-manager}

# Canal des ordres vers arc-publisher : kafka (defaut, file arc.orders) ou api (POST /orders, jeton arc-auth).
arc.orders.channel=${ARC_ORDERS_CHANNEL:kafka}
arc.orders.topic=${ARC_ORDERS_TOPIC:arc.orders}
# Fuseau dans lequel se comptent les jours des dates de debut et de fin.
arc.orders.zone=${ARC_ORDERS_ZONE:UTC}

# Validation des jetons JWT emis par arc-auth (cles publiques recuperees a la demande).
# issuer-uri : valeur attendue de iss, obligatoire (aucune decouverte OIDC avec jwk-set-uri).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${ARC_SECURITY_JWK_SET_URI:http://arc-auth:8082/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ARC_SECURITY_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ARC_SECURITY_AUDIENCE:arc}

# Compte de service utilise pour appeler arc-publisher en mode api (role ARC_PUBLISHER).
arc.auth.url=${ARC_AUTH_URL:http://arc-auth:8082}
arc.auth.username=${ARC_AUTH_USERNAME}
arc.auth.password=${ARC_AUTH_PASSWORD}



# Decouverte des comptes non utilisateurs dans les evenements consolides (desactivee par defaut).
arc.discovery.enabled=${ARC_DISCOVERY_ENABLED:false}
arc.discovery.topic=${ARC_DISCOVERY_TOPIC:arc.sync.identity}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:product-manager}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Types de compte (nom, nature NON_USER/USER, regex a groupe nomme product/identity, metadonnees).
# Definis par le deploiement, ex. ARC_ACCOUNTS_TYPES_0_NAME, ARC_ACCOUNTS_TYPES_0_KIND, ARC_ACCOUNTS_TYPES_0_PATTERN.
