name: ppm1-integration


on:
  push:
      tags:
        - "[0-9]+.[0-9]+.[0-9]+"  # Déclenche seulement sur les tags x.y.z
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
      environment:
        description: 'Environment'
        required: false
        default: 'dev'
        type: string

jobs:
  start-pipeline:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Log level: $LEVEL"
          echo "Tags: $TAGS"
          echo "Environment: $ENVIRONMENT"
        env:
          LEVEL: ${{ inputs.logLevel }}
          TAGS: ${{ inputs.tags }}
          ENVIRONMENT: ${{ inputs.environment }}
  
  integration-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          echo "SPRING_DATASOURCE_URL=${{ vars.DATASOURCE_URL }}" >> .env
          echo "SPRING_DATASOURCE_USERNAME=${{ vars.DATASOURCE_USER }}" >> .env
          echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "ROOT_DATASOURCE_PASSWORD=${{ secrets.ROOT_DB_PASSWORD }}" >> .env
          echo "SPRING_SECURITY_USER_NAME=${{ vars.ECR_REPOSITORY }}" >> .env
          echo "SPRING_SECURITY_USER_PASSWORD=${{ secrets.API_SECURITY_ACCESS }}" >> .env
          echo "SPRING_FLYWAY_URL=${{ vars.DATASOURCE_URL }}" >> .env
          echo "SPRING_FLYWAY_USER=${{ vars.DATASOURCE_USER }}" >> .env
          echo "SPRING_FLYWAY_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "SPRING_PROFILES_ACTIVE=${{ vars.ENVIRONMENT || 'default' }}" >> .env

      - name: Extract version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=latest" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create ECR repository If not exists
        run: |
          aws ecr describe-repositories --repository-names ${{ vars.ECR_REPOSITORY_API }} >/dev/null 2>&1 \
          || aws ecr create-repository --repository-name ${{ vars.ECR_REPOSITORY_API }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t ${{ vars.ECR_REPOSITORY_API }}:latest .

      - name: Tag Docker image
        run: |
          docker tag ppm1:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY_API }}:latest
      - name: Push Docker image
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY_API }}:latest
       
