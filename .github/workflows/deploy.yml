name: Deploy to AWS

on:
  push:
      tags:
        - "[0-9]+.[0-9]+.[0-9]+"  # Déclenche seulement sur les tags x.y.z
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true

jobs:
  log-the-inputs:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Log level: $LEVEL"
          echo "Tags: $TAGS"
          echo "Environment: $ENVIRONMENT"
        env:
          LEVEL: ${{ inputs.logLevel }}
          TAGS: ${{ inputs.tags }}
          ENVIRONMENT: ${{ inputs.environment }}
  
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          echo "SPRING_DATASOURCE_URL=${{ vars.DATASOURCE_URL }}" >> .env
          echo "SPRING_DATASOURCE_USERNAME=${{ vars.DATASOURCE_USER }}" >> .env
          echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "ROOT_DATASOURCE_PASSWORD=${{ secrets.ROOT_DB_PASSWORD }}" >> .env
          echo "SPRING_SECURITY_USER_NAME=${{ vars.ECR_REPOSITORY }}" >> .env
          echo "SPRING_SECURITY_USER_PASSWORD=${{ secrets.API_SECURITY_ACCESS }}" >> .env
          echo "SPRING_FLYWAY_URL=${{ vars.DATASOURCE_URL }}" >> .env
          echo "SPRING_FLYWAY_USER=${{ vars.DATASOURCE_USER }}" >> .env
          echo "SPRING_FLYWAY_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "SPRING_PROFILES_ACTIVE=${{ vars.ENVIRONMENT }}" >> .env

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create ECR repository If not exists
        run: |
          aws ecr describe-repositories --repository-names ${{ vars.ECR_REPOSITORY }} >/dev/null 2>&1 \ || aws ecr create-repository --repository-name ${{ vars.ECR_REPOSITORY }}

      - name: Build Docker image
        run: |
        
           docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:latest .

      - name: Push Docker image to Amazon ECR
        run: |
          docker tag ${{ vars.ECR_REPOSITORY }}:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}1.amazonaws.com/${{ vars.ECR_REPOSITORY }}:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster my-cluster --service my-service --force-new-deployment
