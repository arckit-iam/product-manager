name: ppm1-delivery-ghcr

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      environment:
        description: 'Environment'
        required: false
        default: 'prod'
        type: string
  workflow_run:
    workflows: ["ppm1-integration-ghcr"]
    types:
      - completed
    branches:
      - main

jobs:
  start-pipeline:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Log level: $LEVEL"
          echo "Environment: $ENVIRONMENT"
        env:
          LEVEL: ${{ inputs.logLevel }}
          ENVIRONMENT: ${{ inputs.environment }}
  
  deploy-to-ovh:
    runs-on: ubuntu-latest
    needs: start-pipeline
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

      - name: Deploy to OVH VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }} << 'EOF'
            cd /opt/ppm1
            
            # Arrêter l'ancien conteneur
            docker-compose down || true
            
            # Nettoyer les anciennes images
            docker system prune -f
            
            # Login GitHub Container Registry (utilise le token GitHub)
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Télécharger la nouvelle image
            docker pull ghcr.io/${{ github.repository_owner }}/ppm1:latest
            
            # Redémarrer avec la nouvelle image
            export GHCR_REGISTRY_URL=ghcr.io/${{ github.repository_owner }}
            docker-compose up -d
            
            # Vérifier que l'application démarre
            sleep 30
            curl -f http://localhost:8080/actuator/health || exit 1
            
            echo "Deployment successful!"
          EOF

      - name: Health Check
        run: |
          sleep 10
          curl -f http://${{ secrets.OVH_SERVER_IP }}:8080/actuator/health
      