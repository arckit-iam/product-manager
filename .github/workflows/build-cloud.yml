name: ppm1-setup-ovh-ghcr

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      environment:
        description: 'Environment'
        required: false
        default: 'prod'
        type: string

jobs:
  start-pipeline:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Log level: $LEVEL"
          echo "Environment: $ENVIRONMENT"
        env:
          LEVEL: ${{ inputs.logLevel }}
          ENVIRONMENT: ${{ inputs.environment }}
  
  setup-ovh-environment:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

    - name: Setup OVH VPS Environment
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }} << 'EOF'
          # Mettre à jour le système
          sudo apt update && sudo apt upgrade -y
          
          # Installer Docker si pas déjà installé
          if ! command -v docker &> /dev/null; then
            curl -fsSL https://get.docker.com -o get-docker.sh
            sudo sh get-docker.sh
            sudo usermod -aG docker $USER
          fi
          
          # Installer Docker Compose si pas déjà installé
          if ! command -v docker-compose &> /dev/null; then
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          
          # Créer le répertoire de l'application
          sudo mkdir -p /opt/ppm1
          sudo chown $USER:$USER /opt/ppm1
          
          echo "OVH environment setup completed!"
        EOF

    - name: Copy deployment files to OVH
      run: |
        scp -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }}:/opt/ppm1/
        
        # Créer le fichier .env sur le serveur
        ssh -o StrictHostKeyChecking=no ${{ secrets.OVH_SSH_USER }}@${{ secrets.OVH_SERVER_IP }} << 'EOF'
          cd /opt/ppm1
          cat > .env << 'ENVFILE'
          GHCR_REGISTRY_URL=ghcr.io/${{ github.repository_owner }}
          SPRING_DATASOURCE_URL=jdbc:mysql://ppm1-db-container:3306/ppm1?allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME=ppm1_api
          SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}
          SPRING_DATASOURCE_DATABASE=ppm1
          ROOT_DATASOURCE_PASSWORD=${{ secrets.ROOT_DB_PASSWORD }}
          SPRING_SECURITY_USER_NAME=ppm1
          SPRING_SECURITY_USER_PASSWORD=${{ secrets.API_SECURITY_ACCESS }}
          SPRING_FLYWAY_URL=jdbc:mysql://ppm1-db-container:3306/ppm1?allowPublicKeyRetrieval=true&useSSL=false
          SPRING_FLYWAY_USER=ppm1_api
          SPRING_FLYWAY_PASSWORD=${{ secrets.DB_PASSWORD }}
          SPRING_FLYWAY_ENABLED=true
          SPRING_JPA_SHOW_SQL=false
          SPRING_PROFILES_ACTIVE=prod
          ENVFILE
        EOF


