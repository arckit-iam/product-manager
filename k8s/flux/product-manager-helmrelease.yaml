---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: product-manager
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: k8s
      sourceRef:
        kind: GitRepository
        name: product-manager
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/arckit-iam/product-manager
      tag: "1.1.11-dev"
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ghcr
    database:
      url: "jdbc:postgresql://product-manager-postgres.default.svc.cluster.local:5432/product_manager"
      username: "product_manager"
    security:
      username: "product_manager"
