---
imagePullSecrets:
  - name: ghcr
replicaCount: 1
image:
  repository: ghcr.io/arckit-iam/product-manager
  tag: "1.0.0-dev"
  pullPolicy: Always

database:
  url: "jdbc:postgresql://product-manager-postgres.default.svc.cluster.local:5432/product_manager"
  username: "product_manager"
  # Le mot de passe est dans le Secret Kubernetes "product-manager-db-secret" (clé: password)

security:
  # username et password sont dans le Secret Kubernetes "product-manager-api-secret"
  username: "product_manager"

server:
  port: "8080"
