---
# CE FICHIER N'EST PAS APPLIQUÉ DIRECTEMENT.
# Le secret est créé/mis à jour automatiquement par deploy.yml
# depuis le GitHub Secret "PRODUCT_MANAGER_DB_PASSWORD".
#
# Pour créer manuellement (hors CI) :
#   kubectl create secret generic product-manager-db-secret \
#     --from-literal=username=product_manager \
#     --from-literal=password=MON_MOT_DE_PASSE
#
# Structure attendue :
#   - username: product_manager
#   - password: <défini dans GitHub Secrets → PRODUCT_MANAGER_DB_PASSWORD>
