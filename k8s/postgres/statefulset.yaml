---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: product-manager-postgres
  namespace: default
spec:
  serviceName: product-manager-postgres
  replicas: 1
  selector:
    matchLabels:
      app: product-manager-postgres
  template:
    metadata:
      labels:
        app: product-manager-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: product_manager
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: product-manager-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-manager-db-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "product_manager", "-d", "product_manager"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "product_manager", "-d", "product_manager"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: product-manager-postgres-pvc
